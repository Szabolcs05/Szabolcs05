<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#151B3B"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"><animate attributeName="stop-color" values="#A78BFA;#22D3EE;#A78BFA" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#A78BFA;#22D3EE" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="c"><rect width="1200" height="300" rx="24"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
    @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,30px)}}
    @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-140px,-20px)}}
    @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes dash{to{stroke-dashoffset:-60}}
    .b1{animation:float1 9s ease-in-out infinite}
    .b2{animation:float2 11s ease-in-out infinite}
    .h{animation:rise 1s ease-out both}
    .s{animation:rise 1s .4s ease-out both}
    .r{animation:rise 1s .8s ease-out both}
    .ring{stroke-dasharray:10 20;animation:dash 3s linear infinite}
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity=".55">
      <circle class="b1" cx="250" cy="90" r="110" fill="#7C5CFF"/>
      <circle class="b2" cx="950" cy="220" r="120" fill="#22D3EE"/>
    </g>
    <circle class="ring" cx="1040" cy="90" r="46" fill="none" stroke="#A78BFA" stroke-opacity=".5" stroke-width="2"/>
    <circle class="ring" cx="1040" cy="90" r="70" fill="none" stroke="#22D3EE" stroke-opacity=".3" stroke-width="2" style="animation-direction:reverse"/>
    <text class="t h" x="80" y="140" font-size="68" font-weight="800" fill="url(#txt)">Hi, I'm Szabolcs</text>
    <text class="t s" x="82" y="190" font-size="28" font-weight="500" fill="#E6E9F5">Junior Full-Stack Developer <tspan fill="#A78BFA">@ KFS Group</tspan></text>
    <text class="t r" x="82" y="232" font-size="18" fill="#8D96B8">Web · Automation · Clean code · Founder of Elixify</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="24" fill="none" stroke="#2A3260"/>
</svg>
